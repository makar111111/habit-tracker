# Два сервіси з одного образу: API і бот.
#
#   docker compose up -d --build     запустити
#   docker compose logs -f bot       дивитись логи бота
#   docker compose down              зупинити
#
# Секрети беруться з .env — той самий файл, що й при запуску без Docker.
# У сам образ вони не потрапляють (див. .dockerignore).

services:
  api:
    build: .
    # Ім'я контейнера фіксуємо, щоб команди були передбачувані
    # незалежно від назви теки, з якої запускають compose.
    container_name: habits-api
    restart: unless-stopped

    environment:
      # Чотири слеші — абсолютний шлях. Три (як у типовому запуску)
      # означали б відносний, і база лягла б усередину контейнера,
      # звідки зникла б при першому ж перезапуску.
      DATABASE_URL: sqlite:////data/habits.db
      BOT_SECRET: ${BOT_SECRET:?BOT_SECRET не заданий — заповни .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET не заданий — заповни .env}
      BOT_USERNAME: ${BOT_USERNAME:?BOT_USERNAME не заданий — заповни .env}
      # Для локального HTTP false; при публікації через HTTPS — true.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOW_LOCAL_USER: "false"
      BACKUP_DIR: /data/backups
      # Системні логи мають спільний пояс. День звичок і нагадувань
      # визначається часовим поясом у налаштуваннях кожної людини.
      TZ: ${TZ:-Europe/Kyiv}
      # Від кого uvicorn приймає X-Forwarded-For (справжня IP відвідувача
      # за reverse proxy). Проксі на хості приходить у контейнер з адреси
      # шлюзу мережі Docker — типово з діапазону 172.16.0.0/12.
      #
      # НЕ "*": тоді uvicorn бере крайню ЛІВУ адресу заголовка, яку пише
      # сам клієнт, і ліміт входу обходиться вигаданими IP. З конкретною
      # мережею він іде справа наліво й бере першу недовірену — справжню.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}

    volumes:
      # База переживає перезбирання образу й перезапуск контейнера
      # лише тому, що лежить на іменованому томі, а не всередині.
      - habits-data:/data

    # Для доступу ззовні HTTPS reverse proxy передає запити сюди.
    # Вебвхід — підтвердження через Telegram; без сесії API повертає 401.
    ports:
      - "127.0.0.1:8000:8000"

    # Бот має стартувати, коли API вже відповідає, а не просто "запущений".
    # Без перевірки depends_on чекав би лише на створення контейнера,
    # а не на готовність застосунку в ньому.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Перші кілька секунд невдачі не рахуються за збій — застосунок
      # ще піднімається.
      start_period: 10s

  bot:
    build: .
    container_name: habits-bot
    restart: unless-stopped

    # Той самий образ, інша команда.
    command: ["python", "-m", "bot"]

    environment:
      # api — це ім'я сервісу вище. Docker сам піднімає для них спільну
      # мережу й резолвить імена, тож 127.0.0.1 тут НЕ спрацював би:
      # для бота це був би його власний контейнер, а не сусідній.
      API_URL: http://api:8000
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN не заданий — заповни .env}
      BOT_SECRET: ${BOT_SECRET:?BOT_SECRET не заданий — заповни .env}
      REMINDER_HOUR: ${REMINDER_HOUR:-20}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      # Часовий пояс системних логів; особистий розклад зберігає API.
      TZ: ${TZ:-Europe/Kyiv}

    depends_on:
      api:
        condition: service_healthy

volumes:
  habits-data:
