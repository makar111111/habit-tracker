name: Тести

# Ганяємо на кожен push і на кожен pull request. Сенс саме в PR:
# зелена галочка з'являється просто в обговоренні змін, ще до злиття.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та сама версія, що й у розробці та в Dockerfile. Розбіжність
          # тут означала б, що CI перевіряє не той Python, на якому
          # застосунок працюватиме.
          python-version: "3.14"
          # Кеш встановлених пакетів між запусками: без нього кожен
          # прогін наново тягнув би fastapi з залежностями.
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements-dev.txt

      - name: Прогнати тести
        run: python -m pytest -q
        env:
          # Тести підміняють BOT_SECRET через monkeypatch, тож справжній
          # тут не потрібен — і саме тому CI не потребує жодних секретів
          # репозиторію. Змінна задана порожньою навмисно: так перевіряється
          # ще й те, що застосунок стартує без налаштувань.
          BOT_SECRET: ""
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_URL: "sqlite://"
          TZ: Europe/Kyiv

  # Фронтенд перевіряється окремим завданням і ПАРАЛЕЛЬНО з pytest:
  # між ними немає залежності, тож черга тут лише марно додавала б
  # хвилини до кожного прогону.
  frontend:
    runs-on: ubuntu-latest

    # Усі кроки виконуються в теці frontend/ — інакше кожен рядок
    # починався б із `cd frontend &&`.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Де шукати lock-файл для кешу. Без цього рядка action шукає
          # його в корені репозиторію — а там його немає.
          cache-dependency-path: frontend/package-lock.json

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити типи
        run: npx tsc --noEmit

      - name: Прогнати тести
        run: npm test

      # Збірка — теж перевірка. Помилка, яку не бачить ні tsc, ні
      # vitest (наприклад, імпорт файлу, якого немає), спливає саме тут.
      - name: Зібрати
        run: npm run build

  # Справжній образ і налаштування Compose на одноразовому томі.
  # Запускається лише API: тестові значення не звертаються до Telegram.
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: habits-ci
      BOT_SECRET: test-bot-secret-for-ci-only
      BOT_TOKEN: "123456789:TEST_TOKEN_NOT_FOR_TELEGRAM"
      BOT_USERNAME: testbot
      SESSION_SECRET: test-session-secret-for-ci-only
      SESSION_COOKIE_SECURE: "false"
      TZ: Europe/Kyiv

    steps:
      - uses: actions/checkout@v4

      - name: Зібрати й дочекатися готовності API
        run: docker compose up --build --detach --wait --wait-timeout 120 api

      - name: Перевірити health, вебзбірку та налаштований вхід
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          with urllib.request.urlopen(base + "/health", timeout=10) as response:
              assert response.status == 200
              assert json.load(response)["status"] == "ok"
          with urllib.request.urlopen(base + "/app/", timeout=10) as response:
              assert response.status == 200
              assert b'<div id="root"' in response.read()
          request = urllib.request.Request(base + "/auth/login-code", method="POST")
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 201
              data = json.load(response)
              assert data["token"]
              assert data["url"].startswith("https://t.me/testbot?start=")
          try:
              urllib.request.urlopen(base + "/habits", timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError("Unauthenticated habits access must be denied")
          PY

      - name: Логи контейнерів
        if: always()
        run: docker compose logs --no-color

      - name: Видалити лише одноразові CI-контейнери й том
        if: always()
        run: docker compose down --volumes
