# Лінтер для Python. Запуск: python -m ruff check .
#
# Набір правил задано ЯВНО, а не «за замовчуванням»: нові версії ruff
# розширюють типовий набір, і без цього рядка оновлення лінтера раптом
# давало б десятки нових знахідок у коді, який ніхто не чіпав.
target-version = "py314"

[lint]
# Лише правила, що ловлять справжні помилки, а не стиль:
#   F      — pyflakes: невикористані імпорти й змінні, невизначені імена
#   E4/E7/E9 — помилки імпорту, порівняння на кшталт `== None`, синтаксис
#   B      — bugbear: пастки на кшталт змінного значення за замовчуванням
#
# Свідомо НЕ ввімкнено:
#   DTZ — вимагає часовий пояс у кожному datetime. У проєкті код входу
#         навмисно пише й порівнює локальний час без поясу (models.py,
#         LoginToken.created_at) — обидва боки узгоджені, тож усі ~20
#         знахідок були б хибними.
#   UP, I — осучаснення синтаксису й сортування імпортів: косметика,
#         що роздуває диф і не знаходить жодного бага.
select = ["F", "E4", "E7", "E9", "B"]

[lint.flake8-bugbear]
# `Depends(...)` у значенні за замовчуванням — штатний спосіб FastAPI
# оголосити залежність, а не помилка «виклик у дефолті».
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie"]
